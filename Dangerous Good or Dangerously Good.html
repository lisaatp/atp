document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"ffb4c1e2-3a44-438e-8a80-262f3e6b97ea\"><\u002Fscript>\n\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* Urbanist — AllTransPack brand typeface */\n@font-face{font-family:\"Urbanist\";src:url(\"2b41898e-7612-4ec2-9d3c-c764b32d8c9f\") format(\"truetype\");font-weight:300;font-style:normal;font-display:swap}\n@font-face{font-family:\"Urbanist\";src:url(\"19a130b0-7cea-4c49-975a-06be30e7504c\") format(\"truetype\");font-weight:400;font-style:normal;font-display:swap}\n@font-face{font-family:\"Urbanist\";src:url(\"cf639a05-c89b-4d2d-9391-a9e356c1330d\") format(\"truetype\");font-weight:400;font-style:italic;font-display:swap}\n@font-face{font-family:\"Urbanist\";src:url(\"ae7152ce-a73e-48f5-a32a-c87530d3c85b\") format(\"truetype\");font-weight:500;font-style:normal;font-display:swap}\n@font-face{font-family:\"Urbanist\";src:url(\"968f5ba5-908f-48d1-a053-86f3cab62ccf\") format(\"truetype\");font-weight:600;font-style:normal;font-display:swap}\n@font-face{font-family:\"Urbanist\";src:url(\"897406ab-1af9-495a-942e-961ec7214ec3\") format(\"truetype\");font-weight:700;font-style:normal;font-display:swap}\n@font-face{font-family:\"Urbanist\";src:url(\"1fd5e1ce-b20c-43b3-b12e-04246ea9f6f5\") format(\"truetype\");font-weight:800;font-style:normal;font-display:swap}\n@font-face{font-family:\"Urbanist\";src:url(\"f1f14c64-7e13-40d2-9079-eb2e7f3a7862\") format(\"truetype\");font-weight:900;font-style:normal;font-display:swap}\n<\u002Fstyle>\n<style>/* AllTransPack — Color tokens\n   Official palette (ATP Brand Guidelines 2024):\n   Midnight Blue #00193D · Express Blue #007FFF · Freight Orange #FF8000 · Jetstream Blue #EBF3FF */\n:root{\n  /* ---- Brand core (official names) ---- */\n  --atp-midnight-blue:#00193d;  /* Midnight Blue — primary brand ink */\n  --atp-express-blue:#007fff;   /* Express Blue — primary action / logo mark */\n  --atp-freight-orange:#ff8000; /* Freight Orange — energy accent / logo mark */\n  --atp-jetstream-blue:#ebf3ff; /* Jetstream Blue — lightest tint surface */\n\n  --atp-navy-900:#00193d;   /* = Midnight Blue */\n  --atp-navy-800:#0a2a5c;\n  --atp-navy-700:#123a78;\n  --atp-blue-600:#0066d6;\n  --atp-blue-500:#007fff;   /* = Express Blue */\n  --atp-blue-400:#3d9cff;\n  --atp-blue-300:#7bbcff;\n  --atp-blue-100:#d6ebff;\n  --atp-blue-50:#ebf3ff;    /* = Jetstream Blue */\n\n  --atp-orange-600:#e06e00;\n  --atp-orange-500:#ff8000;  /* = Freight Orange */\n  --atp-orange-400:#ff9d3d;\n  --atp-orange-100:#ffe6cc;\n  --atp-orange-50:#fff4e8;\n\n  /* ---- Neutral ramp (cool, tinted toward navy) ---- */\n  --atp-white:#ffffff;\n  --atp-gray-50:#f6f8fb;\n  --atp-gray-100:#eef1f6;\n  --atp-gray-200:#e0e5ee;\n  --atp-gray-300:#c8d0dd;\n  --atp-gray-400:#9aa6b8;\n  --atp-gray-500:#6b7688;\n  --atp-gray-600:#4b5567;\n  --atp-gray-700:#333c4d;\n  --atp-gray-800:#1f2836;\n  --atp-gray-900:#0f1622;\n\n  /* ---- Semantic status ---- */\n  --atp-success-500:#12a150;\n  --atp-success-50:#e7f7ee;\n  --atp-warning-500:#f5a623;\n  --atp-warning-50:#fdf3e0;\n  --atp-danger-500:#e02424;\n  --atp-danger-50:#fbeaea;\n  --atp-info-500:#007fff;\n  --atp-info-50:#ebf3ff;\n\n  /* ---- Semantic aliases ---- */\n  --color-brand:var(--atp-navy-900);\n  --color-primary:var(--atp-blue-500);\n  --color-primary-hover:var(--atp-blue-600);\n  --color-accent:var(--atp-orange-500);\n  --color-accent-hover:var(--atp-orange-600);\n\n  --text-strong:var(--atp-navy-900);\n  --text-body:var(--atp-gray-700);\n  --text-muted:var(--atp-gray-500);\n  --text-inverse:var(--atp-white);\n  --text-link:var(--atp-blue-600);\n\n  --surface-page:var(--atp-gray-50);\n  --surface-card:var(--atp-white);\n  --surface-sunken:var(--atp-gray-100);\n  --surface-brand:var(--atp-navy-900);\n  --surface-inverse:var(--atp-navy-900);\n\n  --border-subtle:var(--atp-gray-200);\n  --border-default:var(--atp-gray-300);\n  --border-strong:var(--atp-gray-400);\n  --border-focus:var(--atp-blue-500);\n}\n<\u002Fstyle>\n<style>/* AllTransPack — Typography tokens */\n:root{\n  --font-sans:\"Urbanist\",-apple-system,BlinkMacSystemFont,\"Segoe UI\",Helvetica,Arial,sans-serif;\n  --font-display:\"Urbanist\",-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif;\n  --font-mono:ui-monospace,\"SF Mono\",Menlo,Consolas,monospace;\n\n  /* Weights — Urbanist */\n  --fw-light:300; /* @kind other */\n  --fw-regular:400; /* @kind other */\n  --fw-medium:500; /* @kind other */\n  --fw-semibold:600; /* @kind other */\n  --fw-bold:700; /* @kind other */\n  --fw-extrabold:800; /* @kind other */\n  --fw-black:900; /* @kind other */\n\n  /* Type scale (rem, 16px base) */\n  --fs-display:4.5rem;   /* 72 — hero */\n  --fs-h1:3rem;          /* 48 */\n  --fs-h2:2.25rem;       /* 36 */\n  --fs-h3:1.75rem;       /* 28 */\n  --fs-h4:1.375rem;      /* 22 */\n  --fs-lg:1.125rem;      /* 18 */\n  --fs-body:1rem;        /* 16 */\n  --fs-sm:0.875rem;      /* 14 */\n  --fs-xs:0.75rem;       /* 12 */\n\n  --lh-tight:1.05; /* @kind other */\n  --lh-heading:1.15; /* @kind other */\n  --lh-snug:1.35; /* @kind other */\n  --lh-body:1.6; /* @kind other */\n\n  --ls-tight:-0.02em; /* @kind other */\n  --ls-normal:0; /* @kind other */\n  --ls-wide:0.04em; /* @kind other */\n  --ls-caps:0.08em; /* @kind other */\n}\n<\u002Fstyle>\n<style>/* AllTransPack — Spacing, radii, shadows, motion */\n:root{\n  /* Spacing — 4px base grid */\n  --space-0:0;\n  --space-1:4px;\n  --space-2:8px;\n  --space-3:12px;\n  --space-4:16px;\n  --space-5:20px;\n  --space-6:24px;\n  --space-8:32px;\n  --space-10:40px;\n  --space-12:48px;\n  --space-16:64px;\n  --space-20:80px;\n  --space-24:96px;\n  --space-32:128px;\n\n  /* Radii — friendly rounded (echoes the logo's rounded terminals) */\n  --radius-xs:4px;\n  --radius-sm:8px;\n  --radius-md:12px;\n  --radius-lg:16px;\n  --radius-xl:24px;\n  --radius-pill:999px;\n\n  /* Elevation — cool navy-tinted shadows, never pure black */\n  --shadow-xs:0 1px 2px rgba(0,25,61,0.06);\n  --shadow-sm:0 1px 3px rgba(0,25,61,0.08),0 1px 2px rgba(0,25,61,0.06);\n  --shadow-md:0 4px 12px rgba(0,25,61,0.10);\n  --shadow-lg:0 12px 28px rgba(0,25,61,0.14);\n  --shadow-xl:0 24px 48px rgba(0,25,61,0.18);\n  --shadow-focus:0 0 0 3px rgba(0,127,255,0.30);\n\n  /* Motion */\n  --ease-standard:cubic-bezier(0.2,0.8,0.2,1); /* @kind other */\n  --ease-out:cubic-bezier(0.16,1,0.3,1); /* @kind other */\n  --dur-fast:120ms; /* @kind other */\n  --dur-base:200ms; /* @kind other */\n  --dur-slow:320ms; /* @kind other */\n\n  /* Layout */\n  --container-max:1200px; /* @kind other */\n  --container-narrow:760px; /* @kind other */\n}\n<\u002Fstyle>\n<style>/* AllTransPack — base element defaults (opt-in reset) */\n*,*::before,*::after{box-sizing:border-box}\nbody{\n  margin:0;\n  font-family:var(--font-sans);\n  font-weight:var(--fw-regular);\n  font-size:var(--fs-body);\n  line-height:var(--lh-body);\n  color:var(--text-body);\n  background:var(--surface-page);\n  -webkit-font-smoothing:antialiased;\n  text-rendering:optimizeLegibility;\n}\nh1,h2,h3,h4,h5,h6{\n  font-family:var(--font-display);\n  color:var(--text-strong);\n  line-height:var(--lh-heading);\n  letter-spacing:var(--ls-tight);\n  margin:0 0 0.5em;\n  font-weight:var(--fw-extrabold);\n}\nh1{font-size:var(--fs-h1)}\nh2{font-size:var(--fs-h2)}\nh3{font-size:var(--fs-h3)}\nh4{font-size:var(--fs-h4);font-weight:var(--fw-bold)}\np{margin:0 0 1em;text-wrap:pretty}\na{color:var(--text-link);text-decoration:none;transition:color var(--dur-fast) var(--ease-standard)}\na:hover{color:var(--color-primary-hover);text-decoration:underline}\nsmall{font-size:var(--fs-sm)}\ncode,kbd,pre{font-family:var(--font-mono)}\n::selection{background:var(--atp-blue-100);color:var(--atp-navy-900)}\n.atp-eyebrow{font-size:var(--fs-xs);font-weight:var(--fw-bold);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--color-primary)}\n<\u002Fstyle>\n<style>/* AllTran 0193D 100%); }\n  a { color: var(--atp-express-blue); }\n  a:hover { color: var(--atp-blue-600, #0066CC); }\n  @keyframes atp-arrive { from { opacity: 0; } to { opacity: 1; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"font-family: var(--font-sans); color: var(--atp-midnight-blue); min-height: 100vh; padding: clamp(16px, 4vw, 32px) clamp(12px, 4vw, 20px) 48px; display: flex; flex-direction: column; align-items: center; gap: 20px\">\n\n  <div style=\"width: 100%; max-width: 1000px; display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 16px\">\n    <div style=\"max-width: 720px; display: flex; flex-direction: column; gap: 10px\">\n      <p style=\"margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--atp-freight-orange)\">A sorting game<\u002Fp>\n      <h1 style=\"margin: 0; font-size: clamp(28px, 7vw, 46px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.08; color: #fff\">Dangerous Good or Dangerously Good?<\u002Fh1>\n      <p style=\"margin: 0; font-size: clamp(15px, 3.6vw, 18px); line-height: 1.6; color: #C9DCF7; max-width: 620px\">For learning and fun only: always check current transport regulations for real shipments.<\u002Fp>\n    <\u002Fdiv>\n    <img src=\"d7d837c0-6cbf-43b9-ae08-bae13e8b1e4e\" alt=\"AllTransPack\" style=\"width: clamp(88px, 20vw, 132px); height: auto; flex-shrink: 0\">\n  <\u002Fdiv>\n\n  <div style=\"width: 100%; max-width: 1000px; background: #fff; border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); box-shadow: 0 18px 40px rgba(0,25,61,0.28); padding: clamp(16px, 4vw, 28px)\">\n\n    <sc-if value=\"{{ intro }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display: flex; flex-direction: column; align-items: center; text-align: center; gap: 18px; padding: clamp(24px, 6vw, 56px) clamp(12px, 4vw, 32px)\">\n        <h2 style=\"margin: 0; font-size: clamp(26px, 6.4vw, 38px); font-weight: 800; letter-spacing: -0.02em; max-width: 620px\">Is it a dangerous good? Or <i>dangerously good?<\u002Fi><\u002Fh2>\n        <p style=\"margin: 0; font-size: clamp(16px, 3.8vw, 19px); line-height: 1.6; max-width: 540px\">Nine items, one question.<br><br>Drag each item into a bin — or just tap one. Some are regulated dangerous goods; the rest are simply dangerously good.<\u002Fp>\n                <div style=\"margin-top: 6px\">\n          <x-import component-from-global-scope=\"AllTransPackDesignSystem_7e87dc.Button\" size=\"lg\" sc-camel-on-click=\"{{ start }}\" hint-size=\"180px,50px\">Start sorting <i data-lucide=\"chevrons-right\" style=\"width: 18px; height: 18px\"><\u002Fi><\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ inGame }}\">\n    <div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px\">\n      <div style=\"display: flex; gap: 12px; flex-wrap: wrap\">\n        <div style=\"display: flex; align-items: center; gap: 8px; background: var(--atp-jetstream-blue); border-radius: var(--radius-pill); padding: 10px 18px; font-weight: 700; font-size: 15px; white-space: nowrap\"><i data-lucide=\"package\" style=\"width: 18px; height: 18px\"><\u002Fi> <span>Item {{ itemNo }} of {{ total }}<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 8px; background: var(--atp-jetstream-blue); border-radius: var(--radius-pill); padding: 10px 18px; font-weight: 700; font-size: 15px; white-space: nowrap\"><i data-lucide=\"star\" style=\"width: 18px; height: 18px\"><\u002Fi> <span>Score {{ score }}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <x-import component-from-global-scope=\"AllTransPackDesignSystem_7e87dc.Button\" variant=\"secondary\" size=\"sm\" sc-camel-on-click=\"{{ reset }}\" hint-size=\"120px,36px\">Restart<\u002Fx-import>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showProgress }}\">\n      <div style=\"margin-top: 18px; hei tyle=\"display: flex; flex-wrap: wrap; gap: 16px; margin-top: 16px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ pickDangerous }}\" sc-camel-on-drag-over=\"{{ allowDrop }}\" sc-camel-on-drop=\"{{ dropDangerous }}\" style=\"flex: 1 1 200px; min-height: clamp(96px, 22vw, 128px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-family: var(--font-sans); font-size: clamp(17px, 4.2vw, 22px); font-weight: 800; letter-spacing: -0.01em; cursor: pointer; border-radius: var(--radius-lg); border: 2px dashed var(--atp-express-blue); transition: background var(--dur-base) var(--ease-standard), transform var(--dur-fast) var(--ease-standard); transform: none; background: {{ dangerBg }}; color: {{ dangerFg }}\" style-hover=\"transform: translateY(-3px)\">\n            <i data-lucide=\"alert-triangle\" style=\"width: 30px; height: 30px\"><\u002Fi>\n            Dangerous Good\n          <\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ pickDelicious }}\" sc-camel-on-drag-over=\"{{ allowDrop }}\" sc-camel-on-drop=\"{{ dropDelicious }}\" style=\"flex: 1 1 200px; min-height: clamp(96px, 22vw, 128px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-family: var(--font-sans); font-size: clamp(17px, 4.2vw, 22px); font-weight: 800; letter-spacing: -0.01em; cursor: pointer; border-radius: var(--radius-lg); border: 2px dashed var(--atp-freight-orange); transition: background var(--dur-base) var(--ease-standard), transform var(--dur-fast) var(--ease-standard); transform: none; background: {{ deliciousBg }}; color: {{ deliciousFg }}\" style-hover=\"transform: translateY(-3px)\">\n            <i data-lucide=\"sparkles\" style=\"width: 30px; height: 30px\"><\u002Fi>\n            Dangerously Good\n          <\u002Fbutton>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ answered }}\">\n          <div style=\"position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 12px; overflow: auto; background: rgba(0, 25, 61, 0.42); border-radius: var(--radius-lg); animation: atp-arrive var(--dur-fast) var(--ease-standard)\">\n            <div role=\"status\" aria-live=\"polite\" style=\"width: 100%; max-width: 620px; text-align: center; border-radius: var(--radius-lg); padding: clamp(24px, 5vw, 40px) clamp(20px, 5vw, 38px); box-shadow: 0 20px 44px rgba(0,25,61,0.32); display: flex; flex-direction: column; align-items: center; gap: 10px; background: {{ feedbackBg }}\">\n              <i data-lucide=\"{{ feedbackIcon }}\" style=\"width: 40px; height: 40px\"><\u002Fi>\n              <p style=\"margin: 0; font-size: clamp(20px, 5vw, 26px); font-weight: 800; letter-spacing: -0.01em\">{{ verdictLine }}<\u002Fp>\n              <p style=\"margin: 0; font-size: clamp(16px, 3.6vw, 19px); line-height: 1.6\">{{ explanation }}<\u002Fp>\n              <div style=\"margin-top: 8px\">\n                <x-import component-from-global-scope=\"AllTransPackDesignSystem_7e87dc.Button\" sc-camel-on-click=\"{{ next }}\" hint-size=\"150px,42px\">{{ nextLabel }} <i data-lucide=\"chevrons-right\" style=\"width: 16px; height: 16px\"><\u002Fi><\u002Fx-import>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showHint }}\" hint-placeholder-val=\"{{ true }}\">\n          <p style=\"margin: 16px 0 0; font-size: 14px; font-weight: 600; color: var(--atp-gray-600, #5A6B85)\"><br><\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ done }}\">\n      <div style=\"margin-top: 28px; text-align: center; padding: 32px 20px 20px; animation: atp-arrive var(--dur-base) var(--ease-standard)\">\n        <img src=\"6a2401a4-de71-41da-96c7-ef7cd6c1f8ea\" alt=\"\" style=\"width: 84px; height: auto; margin: 0 auto 18px; display: block\">\n        <p style=\"margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--atp-express-blue)\">Classification complete<\u002Fp>\n        <h2 style=\"margin: 8px 0 0; font-size: clamp(26px, 6.4vw, 34px); font-weight: 800; letter-spacing: -0.02em\">{{ resultTitle }}<\u002Fh2>\n        <p style=\"margin: 16px 0 0; font-size: clamp(40px, 11vw, 56px); font-weight: 800; letter-spacing: -0.03em; color: var(--atp-express-blue)\">{{ finalScore }}<\u002Fp>\n        <p style=\"margin: 14px auto 0; max-width: 520px; font-size: 17px; line-height: 1.6\">{{ resultVerdict }}<\u002Fp>\n        <p style=\"margin: 14px auto 0; max-width: 520px; font-size: 14px; font-style: italic; color: var(--atp-gray-600, #5A6B85)\">This game is for learning and laughs, and is not to be treated as legal or shipping advice.<\u002Fp>\n        <div style=\"display: flex; justify-content: center; margin-top: 24px\">\n          <x-import component-from-global-scope=\"AllTransPackDesignSystem_7e87dc.Button\" size=\"lg\" sc-camel-on-click=\"{{ reset }}\" hint-size=\"160px,50px\">Play again <i data-lucide=\"chevrons-right\" style=\"width: 18px; height: 18px\"><\u002Fi><\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showProgressBar&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showKeyboardHint&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;revealAnswerOnMiss&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nfunction shuffle(a) { const c = a.slice(); for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; } return c; }\n\nconst ALL_ITEMS = [\n  { name: \"Hair Spray\", cls: \"Class 2.1 — flammable aerosol (UN1950)\", answer: \"dangerous\", why: \"A tiny pressurised flamethrower for your bangs. Class 2.1, UN1950 — big hair, bigger paperwork.\" },\n  { name: \"Hot Sauce\", cls: \"Not regulated — no hazard class\", answer: \"delicious\", why: \"Sets your mouth on fire and nothing else. No hazard class, no placard, no mercy.\" },\n  { name: \"Fireworks\", cls: \"Class 1.4G — explosives (UN0336)\", answer: \"dangerous\", why: \"Literally explosives you buy at a roadside stand. Let a professional pack them.\" },\n  { name: \"Perfume\", cls: \"Class 3 — flammable liquid (UN1266)\", answer: \"dangerous\", why: \"Fancy bottle, flammable inside. Class 3, UN1266.\" },\n  { name: \"Strong Coffee\", cls: \"Not regulated — no hazard class\", answer: \"delicious\", why: \"Might make you bounce off the walls and type at record speed. No hazmat here!\" },\n  { name: \"Donuts\", cls: \"Not regulated — no hazard class\", answer: \"delicious\", why: \"No hazard class, no placards, no survivors. The box always arrives lighter than it left.\" },\n  { name: \"Sour Candy\", cls: \"Not regulated — no hazard class\", answer: \"delicious\", why: \"Enough acid to make you pucker, not enough to trouble a customs officer. No hazard class.\" },\n  { name: \"Motorcycle Stunts\", cls: \"Class 3 — flammable liquid powered vehicle (UN3166)\", answer: \"dangerous\", why: \"You'll love the tricks, but motorcycles are UN3166 .\" },\n  { name: \"Sharp Chef's Knives\", cls: \"Not regulated — no hazard class\", answer: \"delicious\", why: \"Scary on your produce, unremarkable in the hold. No hazard class — just watch the edges!\" }\n];\n\nclass Component extends DCLogic {\n  state = { started: false, i: 0, score: 0, choice: null, dragging: false, done: false, order: shuffle(ALL_ITEMS) };\n\n  componentDidMount() { this.icons(); }\n  componentDidUpdate() { this.icons(); }\n  icons() {\n    if (window.lucide) window.lucide.createIcons();\n    else setTimeout(() => window.lucide && window.lucide.createIcons(), 300);\n  }\n\n  choose = (choice) => {\n    if (this.state.choice) return;\n    const correct = choice === this.state.order[this.state.i].answer;\n    this.setState(s => ({ choice, dragging: false, score: s.score + (correct ? 1 : 0) }));\n  };\n\n  next = () => {\n    this.setState(s => (s.i === ALL_ITEMS.length - 1 ? { done: true, choice: null } : { i: s.i + 1, choice: null }));\n  };\n\n  start = () => this.setState({ started: true });\n\n  reset = () => this.setState({ started: true, i: 0, score: 0, choice: null, dragging: false, done: false, order: shuffle(ALL_ITEMS) });\n\n  renderVals() {\n    const { i, score, choice, dragging, done, started } = this.state;\n    const ITEMS = this.state.order;\n    const it = ITEMS[i];\n    const correct = choice && choice === it.answer;\n    const reveal = this.props.revealAnswerOnMiss ?? true;\n    const zone = (key) => {\n      if (!choice) return dragging ? \"var(--atp-blue-50)\" : \"#fff\";\n      if (choice === key) return correct ? \"var(--atp-express-blue)\" : \"var(--atp-gray-100, #E7ECF4)\";\n      if (reveal && key === it.answer) return \"var(--atp-express-blue)\";\n      return \"#fff\";\n    };\n    const fg = (key) => (zone(key) === \"var(--atp-express-blue)\" ? \"#fff\" : \"var(--atp-midnight-blue)\");\n    const last = i === ITEMS.length - 1;\n\n    const pass = Math.ceil(ITEMS.length * 0.7);\n    const resultTitle = score === ITEMS.length ? \"Hazard-hype hero\" : score >= pass ? \"Sharp eye for cargo\" : \"Room to run again\";\n    const resultVerdict = score === ITEMS.length\n      ? \"Perfect score. Your hazard radar is sparkling and nothing slipped past you.\"\n      : score >= pass\n        ? \"Strong work — you spotted which everyday items need extra care in transit.\"\n        : \"A lively first pass. Play again?\";\n\n    return {\n      total: ITEMS.length, itemNo: i + 1, score,\n      itemName: it.name, explanation: it.why, hazardClass: it.cls,\n      progressPct: `${((done ? ITEMS.length : i + 1) / ITEMS.length) * 100}%`,\n      showProgress: started && (this.props.showProgressBar ?? true),\n      showHint: this.props.showKeyboardHint ?? true,\n      intro: !started, inGame: started, playing: started && !done, done: started && done, answered: !!choice,\n      artOpacity: dragging ? 0.55 : 1,\n      [\"r\" + (ALL_ITEMS.indexOf(it) + 1)]: true,\n      dangerBg: zone(\"dangerous\"), deliciousBg: zone(\"delicious\"),\n      dangerFg: fg(\"dangerous\"), deliciousFg: fg(\"delicious\"),\n      feedbackBg: correct ? \"var(--atp-jetstream-blue)\" : \"var(--atp-gray-100, #E7ECF4)\",\n      feedbackIcon: correct ? \"check-circle\" : \"info\",\n      verdictLine: correct ? \"Correct.\" : \"Not quite — this one belongs in the other bin.\",\n      nextLabel: last ? \"See results\" : \"Next item\",\n      finalScore: `${score} / ${ITEMS.length}`,\n      resultTitle, resultVerdict,\n      next: this.next, reset: this.reset, start: this.start,\n      pickDangerous: () => this.choose(\"dangerous\"),\n      pickDelicious: () => this.choose(\"delicious\"),\n      onDragStart: () => this.setState({ dragging: true }),\n      onDragEnd: () => this.setState({ dragging: false }),\n      allowDrop: (e) => e.preventDefault(),\n      dropDangerous: (e) => { e.preventDefault(); this.choose(\"dangerous\"); },\n      dropDelicious: (e) => { e.preventDefault(); this.choose(\"delicious\"); },\n      onArtKey: (e) => {\n        if (e.key === \"ArrowLeft\") { e.preventDefault(); this.choose(\"dangerous\"); }\n        else if (e.key === \"ArrowRight\") { e.preventDefault(); this.choose(\"delicious\"); }\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
